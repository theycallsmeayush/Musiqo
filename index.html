<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Musiqo - A premium web-based music player with 3D Cover Flow, synced lyrics, and immersive audio visualizations.">
  <title>Musiqo</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎵</text></svg>">
</head>
<body>

  <!-- ========== AMBIENT BACKGROUND ========== -->
  <div class="ambient-bg">
    <div class="ambient-orb orb-1"></div>
    <div class="ambient-orb orb-2"></div>
    <div class="ambient-orb orb-3"></div>
  </div>
  <div class="ambient-overlay"></div>

  <!-- ========== SONG LIBRARY SIDEBAR ========== -->
  <div class="library-panel" id="libraryPanel">
    <div class="library-header">
      <h3>🎵 Library</h3>
      <span class="library-count">20 Songs</span>
    </div>
    <div class="library-search">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="rgba(255,255,255,0.4)"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
      <input type="text" class="library-search-input" id="librarySearchInput" placeholder="Search songs..." aria-label="Search songs">
    </div>
    <div class="library-list" id="libraryList">
      <!-- Items injected by JS -->
    </div>
  </div>
  <div class="library-backdrop" id="libraryBackdrop"></div>

  <!-- ========== MAIN APP ========== -->
  <div class="app-container">

    <!-- Header -->
    <header class="app-header">
      <div class="header-logo">
        <svg viewBox="0 0 24 24" width="26" height="26" fill="url(#headerGlow)"><defs><linearGradient id="headerGlow" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#ff6b6b"/><stop offset="100%" stop-color="#ffa502"/></linearGradient></defs><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55C7.79 13 6 14.79 6 17s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
        <h1 class="app-title">Musiqo</h1>
      </div>
    </header>

    <!-- 3D Cover Flow Stage -->
    <div class="coverflow-stage" id="coverflowStage">
      <div class="coverflow-track" id="coverflowTrack">
        <!-- Cards injected by JS -->
      </div>
    </div>

    <!-- Canvas Visualizer -->
    <canvas class="audio-visualizer-canvas" id="audioVisualizerCanvas"></canvas>

  </div>

  <!-- ========== FLOATING PLAYER BAR ========== -->
  <div class="player-bar" id="playerBar">

    <!-- Progress Row -->
    <div class="progress-container">
      <span class="progress-time time-current">0:00</span>
      <div class="progress-bar-wrapper" id="progressBarWrapper">
        <div class="progress-bar-fill" id="progressBarFill"></div>
      </div>
      <span class="progress-time time-total">0:00</span>
    </div>

    <!-- Controls Row -->
    <div class="controls-row">

      <!-- Left: Now Playing Info -->
      <div class="controls-left">
        <!-- Library Toggle -->
        <button class="player-btn library-toggle" id="libraryToggle" title="Library" aria-label="Toggle Library">
          <svg viewBox="0 0 24 24"><path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-1 9h-4v4h-2v-4H9V9h4V5h2v4h4v2z"/></svg>
        </button>
        <div class="now-playing-info">
          <img class="now-playing-thumb" id="npThumb" src="assets/charlie_puth.jpg" alt="Now Playing">
          <div class="now-playing-text">
            <div class="np-title" id="npTitle">Charlie Puth</div>
            <div class="np-artist" id="npArtist">How Long</div>
          </div>

          <!-- Active Wave Component Animation -->
          <div class="wave-container mini-wave" id="miniWave" role="status" title="Audio Wave">
            <span class="wave-bar" style="--i: 0; height: 50%"></span>
            <span class="wave-bar" style="--i: 1; height: 75%"></span>
            <span class="wave-bar" style="--i: 2; height: 100%"></span>
            <span class="wave-bar" style="--i: 3; height: 75%"></span>
            <span class="wave-bar" style="--i: 4; height: 50%"></span>
          </div>
        </div>
      </div>

      <!-- Center: Playback Controls -->
      <div class="controls-center">
        <!-- Shuffle -->
        <button class="player-btn btn-shuffle" id="btnShuffle" title="Shuffle" aria-label="Shuffle">
          <svg viewBox="0 0 24 24"><path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg>
        </button>

        <!-- Previous -->
        <button class="player-btn btn-skip btn-prev" id="btnPrev" title="Previous" aria-label="Previous Track">
          <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
        </button>

        <!-- Play / Pause -->
        <button class="player-btn btn-play" id="btnPlay" title="Play" aria-label="Play/Pause">
          <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        </button>

        <!-- Next -->
        <button class="player-btn btn-skip btn-next" id="btnNext" title="Next" aria-label="Next Track">
          <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
        </button>

        <!-- Repeat -->
        <button class="player-btn btn-repeat" id="btnRepeat" title="Repeat" aria-label="Repeat">
          <svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>
        </button>
      </div>

      <!-- Right: Extra Controls -->
      <div class="controls-right">
        <!-- Volume -->
        <div class="volume-control">
          <button class="player-btn btn-volume" id="btnVolume" title="Volume" aria-label="Volume">
            <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
          </button>
          <input type="range" class="volume-slider" id="volumeSlider" min="0" max="100" value="80" aria-label="Volume Slider">
        </div>
      </div>

    </div>
  </div>

  <!-- ========== AUDIO ELEMENT ========== -->
  <audio id="audioPlayer" preload="metadata"></audio>

  <script src="app.js"></script>
</body>
</html>
