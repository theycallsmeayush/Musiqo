<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Musiqo - A premium web-based music player with 3D Cover Flow, synced lyrics, and immersive audio visualizations.">
  <title>Musiqo</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" type="image/jpeg" href="assets/logo.jpg">
  <link rel="shortcut icon" type="image/jpeg" href="assets/logo.jpg">
  <link rel="apple-touch-icon" href="assets/logo.jpg">
</head>
<body>

  <!-- ========== AMBIENT BACKGROUND ========== -->
  <div class="ambient-bg">
    <div class="ambient-orb orb-1"></div>
    <div class="ambient-orb orb-2"></div>
    <div class="ambient-orb orb-3"></div>
  </div>
  <div class="ambient-overlay"></div>

  <!-- ========== SONG LIBRARY SIDEBAR ========== -->
  <div class="library-panel" id="libraryPanel">
    <div class="library-header">
      <div>
        <h3><img src="assets/logo.jpg" alt="Musiqo Logo" class="library-logo-img"> Library</h3>
        <span class="library-count" id="libraryCountText">20 Songs</span>
      </div>
      <a href="upload.html" class="library-upload-link" title="Upload new song">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
        Upload
      </a>
    </div>

    <!-- Library Section Tabs -->
    <div class="library-tabs">
      <button class="library-tab-btn active" id="tabSongsBtn" data-tab="songs">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55C7.79 13 6 14.79 6 17s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
        Songs
      </button>
      <button class="library-tab-btn" id="tabPlaylistsBtn" data-tab="playlists">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M4 10h12v2H4zm0-4h12v2H4zm0 8h8v2H4zm10 0v6l5-3z"/></svg>
        Playlists
      </button>
    </div>

    <!-- Active Playlist Filter Banner -->
    <div class="active-playlist-banner hidden" id="activePlaylistBanner">
      <div class="banner-text">
        <span class="banner-label">Playlist:</span>
        <strong id="bannerPlaylistTitle">Favorites</strong>
      </div>
      <button class="clear-filter-btn" id="clearPlaylistFilterBtn" title="Show All Songs">Show All</button>
    </div>

    <!-- Songs View -->
    <div class="library-view-content" id="songsView">
      <div class="library-search">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="rgba(255,255,255,0.4)"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
        <input type="text" class="library-search-input" id="librarySearchInput" placeholder="Search songs..." aria-label="Search songs">
      </div>
      <div class="library-list" id="libraryList">
        <!-- Items injected by JS -->
      </div>
    </div>

    <!-- Playlists View -->
    <div class="library-view-content hidden" id="playlistsView">
      <div class="playlists-actions-bar">
        <button class="create-playlist-btn" id="openCreatePlaylistBtn">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
          New Playlist
        </button>
      </div>
      <div class="playlists-list" id="playlistsList">
        <!-- Playlists injected by JS -->
      </div>
    </div>

  </div>
  <div class="library-backdrop" id="libraryBackdrop"></div>

  <!-- ========== SONG OPTIONS CONTEXTUAL MENU ========== -->
  <div class="song-options-menu hidden" id="songOptionsMenu">
    <div class="menu-header">
      <span class="menu-song-title" id="menuSongTitle">Song Title</span>
      <span class="menu-song-artist" id="menuSongArtist">Artist</span>
    </div>
    <div class="menu-items">
      <button class="menu-item" id="menuOptionAddToPlaylist">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M14 10H2v2h12v-2zm0-4H2v2h12V6zm4 8v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zM2 16h8v-2H2v2z"/></svg>
        Add to Playlist
      </button>
      <button class="menu-item" id="menuOptionDownload">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
        Download Song (With Cover & Info)
      </button>
      <button class="menu-item danger-item" id="menuOptionDelete">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
        Delete Song
      </button>
    </div>
  </div>

  <!-- ========== ADD TO PLAYLIST MODAL ========== -->
  <div class="modal-overlay hidden" id="addToPlaylistModal">
    <div class="modal-card">
      <div class="modal-header">
        <h4>➕ Add to Playlist</h4>
        <button class="modal-close-btn" id="closeAddToPlaylistModal">&times;</button>
      </div>
      <div class="modal-body">
        <p class="modal-subtitle">Select a playlist to add <strong id="addToPlaylistSongTitle">Track</strong>:</p>
        <div class="modal-playlists-list" id="modalPlaylistsList">
          <!-- Populated by JS -->
        </div>
        <button class="modal-action-btn secondary-action" id="modalCreateNewPlaylistBtn">
          + Create New Playlist
        </button>
      </div>
    </div>
  </div>

  <!-- ========== CREATE PLAYLIST MODAL ========== -->
  <div class="modal-overlay hidden" id="createPlaylistModal">
    <div class="modal-card">
      <div class="modal-header">
        <h4>✨ Create New Playlist</h4>
        <button class="modal-close-btn" id="closeCreatePlaylistModal">&times;</button>
      </div>
      <div class="modal-body">
        <div class="modal-form-group">
          <label for="newPlaylistName" class="form-label">Playlist Name</label>
          <input type="text" id="newPlaylistName" class="form-input" placeholder="e.g. Favorite Hits / Chill Vibes" required>
        </div>
        <div class="modal-form-group">
          <label for="newPlaylistDesc" class="form-label">Description (Optional)</label>
          <input type="text" id="newPlaylistDesc" class="form-input" placeholder="e.g. Late night roadtrip songs">
        </div>
        <div class="modal-footer">
          <button type="button" class="modal-action-btn secondary-action" id="cancelCreatePlaylistBtn">Cancel</button>
          <button type="button" class="modal-action-btn primary-action" id="submitCreatePlaylistBtn">Create Playlist</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ========== CUSTOM CONFIRMATION MODAL ========== -->
  <div class="modal-overlay hidden" id="customConfirmModal">
    <div class="modal-card confirm-modal-card">
      <div class="confirm-icon-box" id="confirmModalIcon">🗑️</div>
      <h4 class="confirm-title" id="confirmModalTitle">Are you sure?</h4>
      <p class="confirm-message" id="confirmModalMessage">This action cannot be undone.</p>
      <div class="confirm-actions">
        <button type="button" class="modal-action-btn secondary-action" id="confirmModalCancelBtn">Cancel</button>
        <button type="button" class="modal-action-btn danger-action" id="confirmModalOkBtn">Delete</button>
      </div>
    </div>
  </div>

  <!-- Global Toast Notification Container -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- ========== MAIN APP ========== -->
  <div class="app-container">

  <!-- Floating Vertical VisionOS Dock -->
  <aside class="vision-dock">
    <button class="dock-btn library-toggle" title="Open Library">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M4 6h16v2H4zm0 5h16v2H4zm0 5h16v2H4z"/></svg>
    </button>
    <a href="upload.html" class="dock-btn" title="Upload Custom Song">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
    </a>
    <button class="dock-btn" id="dockFavoritesBtn" title="Playlists & Favorites">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
    </button>
  </aside>

  <!-- Header -->
  <header class="app-header">
    <div class="header-logo">
      <img src="assets/logo.jpg" alt="Musiqo Logo" class="brand-logo-img">
      <h1 class="app-title">Musiqo</h1>
    </div>
  </header>

    <!-- 3D Cover Flow Stage -->
    <div class="coverflow-stage" id="coverflowStage">
      <div class="coverflow-track" id="coverflowTrack">
        <!-- Cards injected by JS -->
      </div>
    </div>

    <!-- Canvas Visualizer -->
    <canvas class="audio-visualizer-canvas" id="audioVisualizerCanvas"></canvas>

  </div>

  <!-- ========== FLOATING PLAYER BAR ========== -->
  <div class="player-bar" id="playerBar">

    <!-- Progress Row -->
    <div class="progress-container">
      <span class="progress-time time-current">0:00</span>
      <div class="progress-bar-wrapper" id="progressBarWrapper">
        <div class="progress-bar-fill" id="progressBarFill"></div>
      </div>
      <span class="progress-time time-total">0:00</span>
    </div>

    <!-- Controls Row -->
    <div class="controls-row">

      <!-- Left: Now Playing Info -->
      <div class="controls-left">
        <div class="now-playing-info">
          <img class="now-playing-thumb" id="npThumb" src="assets/charlie_puth.jpg" alt="Now Playing">
          <div class="now-playing-text">
            <div class="np-title" id="npTitle">How Long</div>
            <div class="np-artist" id="npArtist">Charlie Puth</div>
          </div>

          <!-- Active Wave Component Animation -->
          <div class="wave-container mini-wave" id="miniWave" role="status" title="Audio Wave">
            <span class="wave-bar" style="--i: 0; height: 50%"></span>
            <span class="wave-bar" style="--i: 1; height: 75%"></span>
            <span class="wave-bar" style="--i: 2; height: 100%"></span>
            <span class="wave-bar" style="--i: 3; height: 75%"></span>
            <span class="wave-bar" style="--i: 4; height: 50%"></span>
          </div>
        </div>
      </div>

      <!-- Center: Playback Controls -->
      <div class="controls-center">
        <!-- Shuffle -->
        <button class="player-btn btn-shuffle" id="btnShuffle" title="Shuffle" aria-label="Shuffle">
          <svg viewBox="0 0 24 24"><path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg>
        </button>

        <!-- Previous -->
        <button class="player-btn btn-skip btn-prev" id="btnPrev" title="Previous" aria-label="Previous Track">
          <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
        </button>

        <!-- Play / Pause -->
        <button class="player-btn btn-play" id="btnPlay" title="Play" aria-label="Play/Pause">
          <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        </button>

        <!-- Next -->
        <button class="player-btn btn-skip btn-next" id="btnNext" title="Next" aria-label="Next Track">
          <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
        </button>

        <!-- Repeat -->
        <button class="player-btn btn-repeat" id="btnRepeat" title="Repeat" aria-label="Repeat">
          <svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>
        </button>
      </div>

      <!-- Right: Extra Controls -->
      <div class="controls-right">
        <!-- Volume -->
        <div class="volume-control">
          <button class="player-btn btn-volume" id="btnVolume" title="Mute/Unmute Volume" aria-label="Mute/Unmute Volume">
            <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
          </button>
          <input type="range" class="volume-slider" id="volumeSlider" min="0" max="100" value="80" aria-label="Volume Slider">
        </div>
      </div>

    </div>
  </div>

  <!-- ========== AUDIO ELEMENT ========== -->
  <audio id="audioPlayer" preload="metadata"></audio>

  <script src="db.js"></script>
  <script src="app.js"></script>
</body>
</html>
